version: "3.8"

services:
  mysql_db:
    image: mysql:8.0
    container_name: ai_logistics_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_logistics_db}
      MYSQL_USER: ${MYSQL_USER:-logistics_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_app_password}
    ports:
      - "3307:3306"  # Map ra port 3307 tren host de tranh xung dot voi MySQL 3306 cuc bo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_me_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - logistics_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_logistics_backend
    restart: always
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-AI Smart Logistics Tracking System}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MYSQL_SERVER: mysql_db  # Trong mang Docker, host la service name mysql_db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-logistics_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_app_password}
      MYSQL_DB: ${MYSQL_DB:-ai_logistics_db}
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_secure_random_key_min_32_chars}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change_me}
      INITIAL_ADMIN_FULLNAME: ${INITIAL_ADMIN_FULLNAME:-System Administrator}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - logistics_net

volumes:
  mysql_data:
    driver: local

networks:
  logistics_net:
    driver: bridge

